{% extends "movies/base.html" %}

{% block content %}
<div class="container text-center" style="margin-top: 100px;">
    <h1>We're getting this movie ready!</h1>
    <p class="lead">We don't have the details for TMDB ID: <strong>{{ tmdb_id }}</strong> in our local database yet.</p>
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3">Our background worker has been notified. Please refresh in a few seconds.</p>
    <a href="{% url 'home' %}" class="btn btn-outline-primary mt-3">Back to Home</a>
</div>

<script>
    // Optional: Auto-refresh the page after 5 seconds to check if Celery finished
    setTimeout(function(){
       location.reload();
    }, 5000);
</script>
{% endblock %}
